name: afterglow
services:
  app:
    build: .
    image: afterglow-tv:local
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:8080"
    environment:
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PRESENTATION_UPLOAD_MB: ${PRESENTATION_UPLOAD_MB:-256}
    volumes:
      - afterglow_config:/config
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
volumes:
  afterglow_config:
