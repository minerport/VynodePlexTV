name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: go test ./internal/... ./cmd/... && go vet ./internal/... ./cmd/...
      - run: test -z "$(gofmt -l cmd internal)"
      - run: npm ci --prefix web && npm test --prefix web -- --run && npm run lint --prefix web && npm run build --prefix web
      - run: python3 scripts/validate-unraid.py
