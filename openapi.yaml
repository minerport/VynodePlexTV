                - OR
                - NOT
            children:
              type: array
              items:
                $ref: "#/components/schemas/RuleNode"
              minItems: 1
              maxItems: 64
          required:
            - type
            - operator
            - children
        - type: object
          additionalProperties: false
          properties:
            type:
              type: string
              enum:
                - condition
            field: *a1
            operator: *a1
            value:
              oneOf:
                - *a1
                - type: number
                - type: array
                  items: *a1
                - type: array
                  items:
