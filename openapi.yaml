          type: string
        container:
          type: string
        videoCodec:
          type: string
        audioCodec:
          type: string
        resolution:
          type: string
        width:
          type: integer
          nullable: true
        height:
          type: integer
          nullable: true
        bitrate:
          type: integer
          nullable: true
        durationMs:
          type: integer
          format: int64
          nullable: true
        size:
          type: integer
          format: int64
          nullable: true
        optimized:
          type: boolean
          nullable: true
        streams:
          type: array
          items:
            $ref: "#/components/schemas/MediaStream"
    MediaItem:
      type: object
      properties:
        id:
          type: string
        serverId:
          type: string
        libraryId:
          type: string
        libraryTitle:
          type: string
        ratingKey:
          type: string
        parentRatingKey:
          type: string
        grandparentRatingKey:
          type: string
        type:
          type: string
          enum:
            - movie
            - show
            - season
            - episode
        title:
          type: string
        sortTitle:
          type: string
        originalTitle:
          type: string
        summary:
          type: string
        year:
          type: integer
          nullable: true
        contentRating:
          type: string
        rating:
          type: number
          nullable: true
        audienceRating:
          type: number
          nullable: true
        durationMs:
          type: integer
          format: int64
          nullable: true
        addedAt:
          type: integer
          format: int64
          nullable: true
        sourceUpdatedAt:
          type: integer
          format: int64
          nullable: true
        originallyAvailableAt:
          type: string
        studio:
          type: string
        tagline:
          type: string
        index:
          type: integer
          nullable: true
        parentIndex:
          type: integer
          nullable: true
        guid:
          type: string
        available:
          type: boolean
        updatedAt:
          type: integer
          format: int64
          nullable: true
        tags:
          type: array
          items:
            $ref: "#/components/schemas/MediaTag"
        externalIds:
          type: array
          items:
            $ref: "#/components/schemas/ExternalID"
        versions:
          type: array
          items:
            $ref: "#/components/schemas/MediaVersion"
    MediaResult:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MediaItem"
        total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer
    PlexOptions:
      type: object
      properties:
        healthIntervalSeconds:
          type: integer
          minimum: 30
          maximum: 86400
        syncIntervalSeconds:
          type: integer
          minimum: 300
          maximum: 604800
        fullSyncIntervalSeconds:
          type: integer
          minimum: 300
          maximum: 2592000
          description: Must be at least syncIntervalSeconds.
        artworkCacheMb:
          type: integer
          minimum: 16
          maximum: 10240
      additionalProperties: false
      required:
        - healthIntervalSeconds
        - syncIntervalSeconds
        - fullSyncIntervalSeconds
        - artworkCacheMb
    PlexLinkStart:
      type: object
