components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: afterglow_session
  parameters:
    Origin:
      in: header
      name: Origin
      required: true
      schema:
        type: string
      description: Must exactly match APP_ORIGIN.
    CSRF:
      in: header
      name: X-CSRF-Token
      required: true
      schema:
        type: string
  requestBodies:
    Credentials:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - username
              - password
            properties:
              username:
                type: string
                minLength: 3
                maxLength: 40
                pattern: ^[A-Za-z0-9._-]+$
              password:
                type: string
                format: password
                description: Setup requires 12–72 UTF-8 bytes.
  responses:
    Error:
      description: Request failed; error contains a safe user-facing message
      content:
        application/json:
          schema:
            type: object
            required:
              - error
            properties:
              error:
                type: string
  schemas:
    Status:
      type: object
      required:
        - status
      properties:
        status:
          type: string
    Session:
      type: object
      required:
        - user
        - csrfToken
        - expiresAt
      properties:
        user:
          type: object
          required:
            - id
            - username
            - role
          properties:
            id:
              type: string
            username:
              type: string
            role:
              type: string
              enum:
                - OWNER
                - ADMIN
                - USER
        csrfToken:
          type: string
        expiresAt:
          type: integer
          format: int64
          description: UTC Unix seconds
    Settings:
      type: object
      additionalProperties: false
      required:
        - displayName
        - timezone
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 60
        timezone:
          type: string
          example: America/New_York
          description: Explicit IANA timezone; Local is not accepted
    PlexIdentity:
      type: object
      properties:
        machineIdentifier:
          type: string
        friendlyName:
          type: string
        product:
          type: string
        version:
          type: string
        platform:
          type: string
        platformVersion:
          type: string
        owned:
          type: boolean
          nullable: true
        secureConnections:
          type: boolean
          nullable: true
    PlexServer:
      allOf:
        - $ref: "#/components/schemas/PlexIdentity"
        - type: object
          properties:
            id:
              type: string
            name:
              type: string
            baseUrl:
              type: string
            status:
              type: string
              enum:
                - CONNECTED
                - DEGRADED
                - OFFLINE
                - UNAUTHORIZED
            disabled:
              type: boolean
            lastHealthCheckAt:
              type: integer
              format: int64
              nullable: true
            lastSuccessAt:
              type: integer
              format: int64
              nullable: true
            lastError:
              type: string
            createdAt:
              type: integer
              format: int64
              nullable: true
            updatedAt:
              type: integer
              format: int64
              nullable: true
    PlexConnection:
      type: object
      additionalProperties: false
      required:
        - baseUrl
      properties:
        baseUrl:
          type: string
          description: HTTP(S) URL; no userinfo, query, fragment, or relative path segments. Explicit ports
            are preserved.
        token:
          type: string
          format: password
          writeOnly: true
          description: Required on create/test; blank on edit retains stored credential. Never returned.
        name:
          type: string
          maxLength: 100
    PlexLibrary:
      type: object
      properties:
        id:
          type: string
        serverId:
          type: string
        key:
          type: string
        title:
          type: string
        type:
          type: string
        agent:
          type: string
        scanner:
          type: string
        language:
          type: string
        uuid:
          type: string
        revision:
          type: string
        selected:
          type: boolean
        present:
          type: boolean
        supported:
          type: boolean
        lastSyncedAt:
          type: integer
          format: int64
          nullable: true
        lastFullSyncAt:
          type: integer
          format: int64
          nullable: true
        itemCount:
          type: integer
    PlexJob:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum:
            - PLEX_DISCOVERY
            - PLEX_HEALTH_CHECK
            - PLEX_LIBRARY_SYNC
            - PLEX_ARTWORK_MAINTENANCE
        serverId:
          type: string
          nullable: true
        libraryId:
          type: string
          nullable: true
        mode:
          type: string
          enum:
            - full
            - incremental
        status:
          type: string
          enum:
            - QUEUED
            - RUNNING
            - SUCCEEDED
            - FAILED
            - CANCELLED
        createdAt:
          type: integer
          format: int64
          nullable: true
        startedAt:
          type: integer
          format: int64
          nullable: true
        completedAt:
          type: integer
          format: int64
          nullable: true
        processed:
          type: integer
        total:
          type: integer
          nullable: true
          description: Null means indeterminate; never invent progress.
        currentItem:
          type: string
        error:
          type: string
        cancelRequested:
          type: boolean
    MediaTag:
