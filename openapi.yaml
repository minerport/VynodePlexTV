openapi: 3.0.3
info:
  title: Afterglow TV API
  version: 0.7.0
  description: Self-hosted local inventory, deterministic broadcasts, authenticated Plex playback,
    guide/catch-up and personal viewer preferences. Mutations require exact Origin and session CSRF.
    Broadcast presentation is persisted in a unified timeline; optional clips consume real broadcast
    time.
servers:
  - url: /api/v1
tags:
  - name: System
  - name: Authentication
  - name: Settings
  - name: Plex
  - name: Media
  - name: Jobs
  - name: Channels
  - name: Scheduling
  - name: Playback
  - name: Guide
  - name: Presentation
paths:
  /health:
    get:
      tags:
        - System
      summary: Process liveness
      responses:
        "200":
          description: Live
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
  /ready:
    get:
      tags:
        - System
      summary: Database readiness
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "503":
          $ref: "#/components/responses/Error"
  /version:
    get:
      tags:
        - System
      summary: Running build version
      responses:
        "200":
          description: Version
          content:
            application/json:
              schema:
                type: object
                required:
                  - version
                properties:
                  version:
                    type: string
  /auth/status:
    get:
      tags:
        - Authentication
      summary: Check whether the first owner must be created
      responses:
        "200":
          description: Setup state
          content:
            application/json:
              schema:
                type: object
                required:
                  - setupRequired
                properties:
                  setupRequired:
                    type: boolean
        "500":
          $ref: "#/components/responses/Error"
  /auth/setup:
    post:
      tags:
        - Authentication
      summary: Atomically create the first owner; does not sign in
      parameters:
        - $ref: "#/components/parameters/Origin"
      requestBody:
        $ref: "#/components/requestBodies/Credentials"
      responses:
        "201":
          description: Owner created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /auth/login:
    post:
      tags:
        - Authentication
      summary: Sign in and issue a 24-hour HttpOnly SameSite Strict session cookie
      parameters:
        - $ref: "#/components/parameters/Origin"
      requestBody:
        $ref: "#/components/requestBodies/Credentials"
      responses:
        "200":
          description: Authenticated
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /auth/session:
    get:
      tags:
        - Authentication
      security:
        - sessionCookie: []
      summary: Read the authenticated user and session CSRF token
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /auth/logout:
    post:
      tags:
        - Authentication
      security:
        - sessionCookie: []
      summary: Revoke this session and clear its cookie
      parameters:
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CSRF"
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /settings:
    get:
      tags:
        - Settings
      security:
        - sessionCookie: []
      summary: Read application settings
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "401":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
    put:
      tags:
        - Settings
      security:
        - sessionCookie: []
      summary: Update settings (OWNER or ADMIN)
      parameters:
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Settings"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /plex/servers:
    get:
      tags:
        - Plex
      summary: List configured servers, including disconnected inventory sources
      operationId: get_plex_servers
      security:
        - sessionCookie: []
      parameters: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlexServer"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
          description: Safe Plex connection/protocol error, including unauthorized Plex credential (distinct
            from application session expiration).
    post:
      tags:
        - Plex
      summary: Validate and save encrypted server credentials
      operationId: post_plex_servers
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CSRF"
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlexServer"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
          description: Safe Plex connection/protocol error, including unauthorized Plex credential (distinct
            from application session expiration).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlexConnection"
  /plex/connections/test:
    post:
      tags:
        - Plex
      summary: Validate connection and library access without saving credentials
      operationId: post_plex_connections_test
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CSRF"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlexIdentity"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
          description: Safe Plex connection/protocol error, including unauthorized Plex credential (distinct
            from application session expiration).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlexConnection"
  /plex/servers/{id}:
    get:
      tags:
        - Plex
      summary: Read server status (no secrets)
      operationId: get_plex_servers__id_
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlexServer"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
          description: Safe Plex connection/protocol error, including unauthorized Plex credential (distinct
            from application session expiration).
    patch:
      tags:
        - Plex
      summary: Update or reconnect the same machine identity; active jobs must finish first
      operationId: patch_plex_servers__id_
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CSRF"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlexServer"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
          description: Safe Plex connection/protocol error, including unauthorized Plex credential (distinct
            from application session expiration).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlexConnection"
    delete:
      tags:
        - Plex
      summary: Disconnect, erase token, deselect libraries; retain all local inventory
      operationId: delete_plex_servers__id_
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CSRF"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
          description: Safe Plex connection/protocol error, including unauthorized Plex credential (distinct
            from application session expiration).
  /plex/servers/{id}/test:
    post:
      tags:
        - Plex
      summary: Queue an active health check
      operationId: post_plex_servers__id__test
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CSRF"
      responses:
        "202":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlexJob"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
          description: Safe Plex connection/protocol error, including unauthorized Plex credential (distinct
            from application session expiration).
  /plex/servers/{id}/discover:
    post:
      tags:
        - Plex
      summary: Queue complete library discovery
      operationId: post_plex_servers__id__discover
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CSRF"
      responses:
        "202":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlexJob"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
          description: Safe Plex connection/protocol error, including unauthorized Plex credential (distinct
            from application session expiration).
  /plex/servers/{id}/libraries:
    get:
      tags:
        - Plex
      summary: List discovered libraries and available item counts
      operationId: get_plex_servers__id__libraries
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlexLibrary"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
          description: Safe Plex connection/protocol error, including unauthorized Plex credential (distinct
            from application session expiration).
  /plex/libraries/{id}:
    patch:
      tags:
        - Plex
      summary: Select/deselect a library; never delete its inventory
      operationId: patch_plex_libraries__id_
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CSRF"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
          description: Safe Plex connection/protocol error, including unauthorized Plex credential (distinct
            from application session expiration).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - selected
              properties:
                selected:
                  type: boolean
  /plex/libraries/{id}/sync:
    post:
      tags:
        - Plex
      summary: Queue a full or incremental scan of selected library
      operationId: post_plex_libraries__id__sync
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CSRF"
      responses:
        "202":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlexJob"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
          description: Safe Plex connection/protocol error, including unauthorized Plex credential (distinct
            from application session expiration).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                mode:
                  type: string
                  enum:
                    - full
                    - incremental
                  default: incremental
  /plex/settings:
    get:
      tags:
        - Plex
      summary: Read background intervals and artwork budget
      operationId: get_plex_settings
      security:
        - sessionCookie: []
      parameters: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlexOptions"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
          description: Safe Plex connection/protocol error, including unauthorized Plex credential (distinct
            from application session expiration).
    put:
      tags:
        - Plex
      summary: Update background intervals and artwork budget
      operationId: put_plex_settings
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CSRF"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlexOptions"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
          description: Safe Plex connection/protocol error, including unauthorized Plex credential (distinct
            from application session expiration).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlexOptions"
  /jobs:
    get:
      tags:
        - Jobs
      summary: List the 100 most recent jobs (30-day retained history)
      operationId: get_jobs
      security:
        - sessionCookie: []
      parameters: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlexJob"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
          description: Safe Plex connection/protocol error, including unauthorized Plex credential (distinct
            from application session expiration).
  /jobs/{id}:
    get:
      tags:
        - Jobs
      summary: Read persisted progress and outcome
      operationId: get_jobs__id_
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlexJob"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
          description: Safe Plex connection/protocol error, including unauthorized Plex credential (distinct
            from application session expiration).
  /jobs/{id}/cancel:
    post:
      tags:
        - Jobs
      summary: Cancel queued or running work without missing-item reconciliation
      operationId: post_jobs__id__cancel
      security:
        - sessionCookie: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CSRF"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
          description: Safe Plex connection/protocol error, including unauthorized Plex credential (distinct
            from application session expiration).
  /media:
    get:
      tags:
        - Media
      summary: Search admin inventory, including show-title matches for episodes
      operationId: get_media
      security:
        - sessionCookie: []
      parameters:
        - in: query
          name: server
          schema:
            type: string
        - in: query
          name: library
          schema:
            type: string
        - in: query
          name: type
          schema:
            type: string
        - in: query
          name: q
          schema:
            type: string
        - in: query
          name: available
          schema:
            type: string
        - in: query
          name: parent
          schema:
            type: string
          description: Parent Plex rating key; pair with server filter.
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 40
        - in: query
          name: topLevel
          schema:
            type: boolean
            default: false
          description: Return only movies and shows. Child listings use parent plus server and are ordered by
            season/episode index.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaResult"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "502":
