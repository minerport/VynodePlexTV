services:
  plex-fixture:
    image: node:24-alpine
    command: [node, /fixture.mjs]
    environment:
      PLEX_FIXTURE_TOKEN: ${PLEX_FIXTURE_TOKEN:?Generated by the browser test setup}
    volumes:
      - ./web/e2e/fixture.mjs:/fixture.mjs:ro
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:32400/health]
      interval: 2s
      timeout: 2s
      retries: 10
  app:
    image: afterglow-tv:local
    ports: ["127.0.0.1:18080:8080"]
    environment:
      APP_ORIGIN: http://localhost:18080
    volumes:
      - test_config:/config
volumes:
  test_config:
