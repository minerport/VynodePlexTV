name: afterglow
services:
  app:
    image: ghcr.io/minerport/vynodeplextv:latest
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:8080"
    environment:
      APP_ORIGIN: ${APP_ORIGIN:-auto}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - afterglow_config:/config
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
volumes:
  afterglow_config:
